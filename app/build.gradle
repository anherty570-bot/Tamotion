plugins {
    id 'com.android.application'
}

android {
    namespace 'ai.storyteller.tamotion'
    compileSdk 35

    defaultConfig {
        applicationId "ai.storyteller.tamotion"
        minSdk 26
        targetSdk 35
        versionCode 600
        versionName "1.0.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            assets.srcDirs = ['src/main/assets']
        }
    }

    androidResources {
        noCompress 'wasm'
    }

    aaptOptions {
        noCompress 'wasm'
    }
}

dependencies {
}
